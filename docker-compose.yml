# 所有 .env 中的变量都会通过 env_file 注入 web 和 worker，
# 包括 AMAP_API_KEY、STORAGE_DRIVER 等；新增配置只需写进 .env，
# 不需要在这里重复声明（这里只覆盖容器内必须不同的路径类变量）。
services:
  web:
    # 使用项目维护者发布的 AMD64 镜像；版本由 .env 的 HOMEHI_VERSION 控制。
    # 本机不构建镜像，NAS 只拉取与运行。
    image: registry.cn-hangzhou.aliyuncs.com/opxk-public/homehi-web:${HOMEHI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:../data/homehi.db
      STORAGE_DIR: /app/storage
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: registry.cn-hangzhou.aliyuncs.com/opxk-public/homehi-worker:${HOMEHI_VERSION:-latest}
    restart: unless-stopped
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment:
      DATABASE_URL: file:../data/homehi.db
      STORAGE_DIR: /app/storage
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./backups:/app/backups
    depends_on:
      web:
        condition: service_healthy
